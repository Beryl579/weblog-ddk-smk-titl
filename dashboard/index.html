<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Weblog DDK — Siswa</title>
<style>/* Main.html — Weblog DDK — design system (sidebar gelap + konten terang).
   Catatan: berkas ini berekstensi .html, BUKAN .css, karena Google Apps Script
   hanya mengenal dua tipe berkas: script (.gs) dan HTML (.html) — tidak ada
   tipe berkas CSS. Isinya tetap CSS murni dan disisipkan lewat
    di dalam tag <style>. */
:root{
  /* ExcelLab palette - diadaptasi untuk DDK */
  --sidebar-bg:#0f2e1c;
  --sidebar-hover:#143626;
  --sidebar-active:#1a3d2a;
  --sidebar-border:#b8e05a; /* lime accent left border */
  --primary:#166534; /* green utama */
  --primary-dark:#0f2e1c;
  --primary-light:#e6f3e6;
  --accent:#E94560;
  --accent-lime:#c6f277;
  --dark:#0f2417;
  --success:#1DB954;
  --warning:#E6A817;
  --bg:#f4f8f4; /* light greenish - sama seperti ExcelLab */
  --card:#FFFFFF;
  --muted:#6b7c6b;
  --muted2:#8a9a8a;
  --border:#e2e8e2;
  --border-light:#eef4ee;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(15,46,28,0.06);
  --shadow-card:0 2px 12px rgba(15,46,28,0.08);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Inter,Arial,sans-serif;
  font-size:14px; line-height:1.6; color:var(--dark);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1{font-size:22px;font-weight:700;color:var(--dark);line-height:1.3}
h2{font-size:18px;font-weight:600;color:var(--dark)}
small{font-size:12px;color:var(--muted)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:1100px;margin:0 auto;padding:0 16px}
.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-card);
  padding:16px; margin-bottom:16px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:6px; padding:10px 16px; border-radius:999px; border:none;
  font-size:14px;font-weight:600; cursor:pointer; transition:0.15s;
  text-decoration:none;
}
.btn-primary{background:var(--primary-dark);color:#fff; border:1px solid var(--primary-dark)}
.btn-primary:hover{background:#0f1f14; transform:translateY(-1px)}
.btn-accent{background:var(--accent);color:#fff}
.btn-outline{background:#fff;border:1px solid #166534;color:#166534}
.btn-outline:hover{background:var(--primary-light)}
.btn-success{background:var(--success);color:#fff}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.input{
  width:100%; padding:10px 12px; border:1px solid var(--border);
  border-radius:10px; font-size:14px; background:#fff;
}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,101,52,0.12)}
.label{font-size:12px;font-weight:600;color:var(--dark);margin-bottom:4px;display:block}
.form-group{margin-bottom:12px}
.error{color:var(--accent);font-size:12px;margin-top:4px}
.success{color:var(--success);font-size:12px}
.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:600}
.badge-success{background:#e6f7ec;color:#0a7a2e}
.badge-warning{background:#fff3cd;color:#856404}
.badge-danger{background:#fde8eb;color:#a12a3a}
.badge-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:#e6f3e6; color:#166534; border:1px solid #c8e6c9;
  padding:6px 12px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:0.2px;
}
.progress{height:8px;background:#e9ecef;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;transition:width 0.3s}
.progress-bar.green{background:var(--primary)}
.progress-bar.yellow{background:var(--warning)}

/* ===== ExcelLab Layout ===== */
.app{
  display:flex; min-height:100vh;
}
.sidebar{
  width:260px; background:var(--sidebar-bg); color:#d1e7d1;
  display:flex; flex-direction:column; flex-shrink:0;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  border-right:1px solid #1a3d2a;
}
.sidebar-header{
  padding:16px 16px 12px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid #1a3d2a;
}
/* Logo DDK: petir dalam kotak — sengaja BUKAN grid 4 kotak (itu ciri template Excel) */
.logo-icon{
  width:36px;height:36px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#1f7a45,#0d2c1b);
  box-shadow:inset 0 0 0 1px rgba(198,242,119,0.35);
  font-size:19px;line-height:1;color:var(--accent-lime);
}
.sidebar-title{font-weight:700;color:#fff;font-size:15px;line-height:1}
.sidebar-subtitle{font-size:10px;color:#8a9a8a; letter-spacing:0.3px}
.sidebar-section{
  padding:14px 12px 6px; font-size:10px; font-weight:700; letter-spacing:0.8px;
  color:#6b9a6b; text-transform:uppercase;
}
.sidebar-nav{display:flex;flex-direction:column; gap:2px; padding:0 8px}
.sidebar-nav a{
  display:flex; align-items:center; gap:8px;
  padding:8px 10px; border-radius:10px;
  color:#b9d1b9; font-size:13px; font-weight:500; text-decoration:none;
  border-left:3px solid transparent;
  transition:0.15s;
}
.sidebar-nav a:hover{background:var(--sidebar-hover); color:#fff; text-decoration:none}
.sidebar-nav a.active{
  background:var(--sidebar-active); color:#fff;
  border-left-color:var(--sidebar-border);
  font-weight:600;
}
.sidebar-nav a .icon{width:16px; text-align:center; font-size:13px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0}
.sidebar-nav a .icon svg{width:15px;height:15px;display:block}
.sidebar-nav a .icon .num{
  width:16px;height:16px;border-radius:50%;border:1px solid currentColor;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;line-height:1;
}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{display:block}
/* Ikon inline slim di konten — selalu sejajar teks */
.badge-pill svg,.done-tag svg,.lock-tag svg,.locked-note svg,.pill svg,
.blk-note strong svg,.blk-case strong svg,.glossary-title svg,
.materi-content h3 svg,.quiz-top-title svg,.quiz-review-why svg,.why-box svg,
.btn-hero-primary svg,.btn svg{display:inline-block;vertical-align:-2px;margin-right:5px}
.done-tag,.lock-tag{display:inline-flex;align-items:center;gap:5px}
.done-tag{color:#0a7a2e;font-size:11px;font-weight:800}
.lock-tag{color:#a8b3a8;font-size:11px;font-weight:800}
.sidebar-footer{
  margin-top:auto; padding:12px; border-top:1px solid #1a3d2a;
}
.sidebar-footer small{color:#6b9a6b; font-size:11px}

.main{
  flex:1; background:var(--bg); min-width:0;
  padding:24px 28px;
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%; height:auto; position:relative; display:none}
  .sidebar.open{display:flex}
  .main{padding:16px}
  /* Tombol hamburger melayang TIDAK dipakai lagi (satu-satunya pemicu menu
     adalah tombol di mobile-topbar) — aturan display:flex lama dihapus agar
     tidak muncul menu ganda di HP. */
  .hamburger{display:none !important}
}
.hamburger{
  display:none; align-items:center; justify-content:center;
  width:40px;height:40px; border-radius:10px; border:1px solid var(--border);
  background:#fff; color:var(--dark); font-size:18px; cursor:pointer;
  position:fixed; top:12px; left:12px; z-index:60; box-shadow:var(--shadow-card);
}
.mobile-topbar{
  display:none; background:var(--sidebar-bg); color:#fff; padding:10px 16px;
  align-items:center; justify-content:space-between;
}
@media(max-width:900px){
  .mobile-topbar{display:flex}
}

/* Hero ala ExcelLab */
.hero{
  display:grid; grid-template-columns:1.1fr 0.9fr; gap:24px; align-items:center;
  margin-bottom:20px;
}
@media(max-width:900px){ .hero{grid-template-columns:1fr} }
.hero-title{
  font-size:42px; font-weight:800; line-height:1.05; color:#0f2417; letter-spacing:-0.5px;
}
.hero-title span{color:var(--primary); font-weight:800}
@media(max-width:600px){ .hero-title{font-size:28px} }
.hero-desc{
  margin-top:10px; color:#5a6b5a; font-size:14px; line-height:1.6; max-width:520px;
}
.hero-desc strong{color:#0f2417; font-weight:700}
.hero-cta{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px}
.btn-hero-primary{
  background:var(--primary-dark); color:#fff; padding:12px 20px; border-radius:999px;
  font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:8px;
  border:none; cursor:pointer; box-shadow:0 4px 12px rgba(15,46,28,0.15);
}
.btn-hero-primary:hover{background:#0a1f12}
.btn-hero-outline{
  background:#fff; color:var(--primary); padding:12px 20px; border-radius:999px;
  font-weight:600; font-size:14px; border:1px solid #166534; display:inline-flex; align-items:center; gap:6px;
}
.btn-hero-outline:hover{background:var(--primary-light)}

/* ===== Panel Distribusi Progres (pengganti kartu spreadsheet Excel) =====
   Metafora DDK: busbar + MCB (Q1..Q5). Breaker menyala = materi/ujian lulus. */
.panel{
  background:#fff; border:1px solid var(--border); border-radius:16px;
  overflow:hidden; box-shadow:var(--shadow-card);
}
.panel-head{
  background:var(--dark); color:#fff; padding:11px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.panel-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.panel-title .bolt{color:var(--accent-lime);font-size:14px}
.panel-tag{
  font-size:10px; font-weight:800; letter-spacing:0.9px; text-transform:uppercase;
  color:#8fd6a8; border:1px solid rgba(143,214,168,0.4); border-radius:999px; padding:2px 9px;
}
.panel-body{padding:14px}
.busbar{
  height:7px; border-radius:999px; margin-bottom:12px;
  background:linear-gradient(90deg,#f0b429 0%,#c6f277 55%,#7fc79b 100%);
  box-shadow:0 1px 0 rgba(15,46,28,0.12) inset;
}
.breaker{
  display:flex; align-items:center; gap:10px;
  padding:9px 11px; margin-bottom:7px;
  border:1px solid var(--border-light); border-radius:12px; background:#fbfdfb;
}
.breaker:last-child{margin-bottom:0}
.breaker .lamp{width:9px;height:9px;border-radius:50%;background:#cdd8cd;flex-shrink:0}
.breaker .tag{font-size:10px;font-weight:800;color:var(--muted);min-width:24px;letter-spacing:0.4px}
.breaker .name{font-size:13px;font-weight:600;color:var(--dark)}
.breaker .val{margin-left:auto;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.breaker .state{font-size:10px;font-weight:800;letter-spacing:0.4px;color:var(--muted2)}
.breaker.on{border-color:#cdebd7;background:#f2fbf5}
.breaker.on .lamp{background:var(--success);box-shadow:0 0 0 4px rgba(29,185,84,0.15)}
.breaker.on .val{color:var(--primary)}
.breaker.on .state{color:#0a7a2e}
.breaker.off{background:#f7f9f7;border-style:dashed}
.breaker.off .name{color:var(--muted2)}
.breaker.off .state{color:#a8b3a8}
.panel-foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:12px; padding-top:11px; border-top:1px dashed var(--border);
}
.panel-foot .label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px}
.panel-foot .readout{
  font-size:20px;font-weight:800;color:var(--primary);
  font-variant-numeric:tabular-nums;
}
/* Kartu info bergaya plat nama peralatan (untuk halaman ujian) */
.kv-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:9px 0; border-bottom:1px dashed var(--border-light);
}
.kv-row:last-child{border-bottom:none}
.kv-label{font-size:12px;color:var(--muted);font-weight:600}
.kv-val{font-size:14px;font-weight:800;color:var(--dark);font-variant-numeric:tabular-nums}

/* Stat cards ala ExcelLab */
.stats{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin:18px 0;
}
@media(max-width:700px){ .stats{grid-template-columns:1fr} }
.stat-card{
  background:#fff; border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:var(--shadow-card);
}
.stat-number{font-size:28px; font-weight:800; color:var(--primary); line-height:1}
.stat-label{font-size:11px; color:var(--muted); margin-top:2px; font-weight:500}
.stat-bar{height:6px; background:#eef4ee; border-radius:999px; margin-top:12px; overflow:hidden}
.stat-bar-fill{height:100%; background:var(--primary); border-radius:999px}

/* Section why */
.section-why{
  margin-top:16px; background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px; box-shadow:var(--shadow-card);
}
.section-why h2{display:flex; align-items:center; gap:8px; font-size:16px; font-weight:700}
.section-why h2::before{content:''; width:4px;height:18px; background:var(--primary); border-radius:999px; display:block}

/* Legacy navbar fallback (untuk halaman tanpa sidebar) */
.navbar{
  position:sticky;top:0;z-index:50;
  background:var(--primary); color:#fff;
  padding:10px 0; box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.navbar .container{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav-links a{color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:500}
.nav-links a:hover, .nav-links a.active{background:rgba(255,255,255,0.15);text-decoration:none}

/* Grid legacy */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:768px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr} }
.table-wrap{overflow-x:auto;background:#fff;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:#f6fbf6;font-weight:600;user-select:none}
tbody tr:hover{background:#fafdfa}
.toast{
  position:fixed;top:16px;right:16px;z-index:9999;
  background:var(--dark);color:#fff;padding:12px 16px;border-radius:10px;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);font-size:13px;
  opacity:0;visibility:hidden;transform:translateY(-8px);
  transition:opacity 0.25s,transform 0.25s,visibility 0.25s;
  pointer-events:none;
}
.toast.show{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.toast.success{background:var(--primary)}
.toast.error{background:var(--accent)}
.likert{display:flex;gap:8px;flex-wrap:wrap}
.likert label{
  flex:1;min-width:60px;text-align:center;
  border:1px solid var(--border);border-radius:10px;padding:10px 6px;
  cursor:pointer;background:#fff;font-weight:600;transition:0.15s
}
.likert input{display:none}
.likert label:has(input:checked){background:var(--primary);color:#fff;border-color:var(--primary)}
.comment{border-left:3px solid var(--border);padding-left:12px;margin-bottom:12px}
.comment .avatar{
  width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px
}
.quiz-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quiz-nav button{padding:8px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px}
.quiz-nav button.answered{background:var(--success);color:#fff;border-color:var(--success)}
.quiz-nav button.current{border-color:var(--primary);background:var(--primary);color:#fff}
.footer{background:#0f2417;color:#c8d8c8;padding:20px 0;margin-top:32px;font-size:12px}
.footer a{color:#c6f277;text-decoration:underline}
.loading{opacity:0.6;pointer-events:none;position:relative}
.loading::after{content:'Memuat...';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.7);border-radius:var(--radius);font-weight:600}
.fab{
  position:fixed; bottom:20px; right:20px; width:56px;height:56px; border-radius:50%;
  background:var(--primary-dark); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:22px; box-shadow:0 8px 20px rgba(15,46,28,0.25); cursor:pointer; border:3px solid #c6f277; z-index:50;
}
.fab:hover{transform:scale(1.05)}

/* ===== Optimasi Mobile / Smartphone (360px+) =====
   Sasaran: tombol mudah disentuh (min 44px), teks terbaca tanpa zoom,
   tidak ada menu ganda, tabel bisa digeser, toast tidak menutupi layar. */
img{max-width:100%;height:auto}
*{ -webkit-tap-highlight-color:transparent; }
body{ overflow-wrap:anywhere; }

@media(max-width:900px){
  /* Topbar sudah punya tombol menu sendiri -> tombol hamburger melayang disembunyikan
     agar tidak menumpuk/menutupi konten di HP. */
  .hamburger{ display:none !important; }
  .mobile-topbar{ position:sticky; top:0; z-index:55; }

  /* --- Sidebar sebagai drawer overlay (bukan mendorong konten) ---
     Menu melayang di atas konten, punya scroll sendiri, konten belakang terkunci. */
  .sidebar{
    display:flex;
    position:fixed; top:0; left:0; bottom:0;
    width:min(300px, 85vw); height:100dvh; max-height:100dvh;
    z-index:70;
    transform:translateX(-105%);
    transition:transform 0.25s ease;
    overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    box-shadow:none;
  }
  .sidebar.open{ transform:none; box-shadow:8px 0 30px rgba(0,0,0,0.35); }
  .sidebar-backdrop{
    display:none;
    position:fixed; inset:0; z-index:65;
    background:rgba(10,25,15,0.5);
    border:none; padding:0; cursor:pointer;
  }
  .sidebar-backdrop.show{ display:block; }
  body.menu-open{ overflow:hidden; } /* kunci scroll konten belakang saat menu terbuka */

  .main{ padding:14px 12px 90px; } /* ruang bawah agar tidak tertutup FAB/toast */
  .hero-title{ font-size:26px; }
  .hero-cta .btn-hero-primary, .hero-cta .btn-hero-outline{ flex:1 1 100%; justify-content:center; }
  .table-wrap{ -webkit-overflow-scrolling:touch; }
  table{ font-size:12px; }
  th,td{ padding:8px 10px; }
  .toast{ left:12px; right:12px; top:12px; text-align:center; }
}

@media(max-width:600px){
  body{ font-size:15px; } /* keterbacaan di layar kecil */
  h1{ font-size:19px; }
  h2{ font-size:16px; }
  .hero-title{ font-size:24px; line-height:1.15; }
  .hero-desc{ font-size:13px; }
  /* Cegah auto-zoom iOS: input minimal 16px */
  .input, select.input, textarea.input{ font-size:16px; padding:12px; }
  .btn, .btn-hero-primary, .btn-hero-outline{ min-height:48px; font-size:15px; }
  .btn-hero-primary, .btn-hero-outline{ padding:12px 16px; }
  .card{ padding:14px; border-radius:14px; }
  .panel-body{ padding:12px; }
  .breaker .name{ font-size:12px; }
  .stat-number{ font-size:24px; }
  .fab{ bottom:16px; right:16px; width:52px; height:52px; }
}
</style>
<style>
  .materi-hero-card{padding:0;overflow:hidden;margin-top:12px}
  .materi-banner{width:100%;height:240px;object-fit:cover;object-position:center;display:block;background:#eef4ee}
  .materi-hero-body{padding:16px}
  @media(max-width:600px){.materi-banner{height:170px}}
  .img-credit{font-size:10px;color:var(--muted);margin-top:10px}
  .materi-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
  @media(max-width:800px){.materi-list{grid-template-columns:1fr}}
  .materi-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:8px;position:relative}
  .materi-card.locked{opacity:0.65}
  .materi-card h3{font-size:15px;font-weight:700}
  .materi-num{width:34px;height:34px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800}
  .materi-card.done .materi-num{background:var(--success);color:#fff}

    {q:"Setelah presentasi disetujui, kontraktor menerima…", o:["Izin PSDB", "Polis asuransi", "Sertifikat lahan", "SPK (Surat Perintah Kerja)"], a:3, why:"SPK diterbitkan sebagai dasar pelaksanaan pekerjaan, disertai tim pengawas."},
    {q:"Singkatan MEP menambahkan bidang… dibanding ME.", o:["Plumbing (perpipaan)", "Penerbangan", "Pertambangan", "Perkebunan"], a:0, why:"MEP = Mekanikal, Elektrikal, Plumbing; plumbing = sistem perpipaan/sanitasi."},
    {q:"Pengujian yang dilakukan pada sebagian sistem disebut pengujian…", o:["Akhir", "Parsial", "Holistik", "Total"], a:1, why:"Commissioning parsial menguji bagian per bagian; holistik menguji keseluruhan."},
    {q:"Urutan tahapan pelaksanaan pekerjaan ME yang benar…", o:["Pelaksanaan → Persiapan → Tes", "Tes → Persiapan → Pelaksanaan", "Commissioning → Pelaksanaan → Persiapan", "Persiapan → Pelaksanaan → Tes/Commissioning"], a:3, why:"Persiapan (alat/bahan/tenaga) → Pelaksanaan → Tes/Commissioning."},

  ]
},
{
  num:2, judul:'Pembuatan Panel',
  tujuan:'Memahami pengertian panel kendali/distribusi, dasar perpindahan sumber PLN–genset (ATS/AMF), komponen panel, langkah pembuatan, dan dasar perhitungan proteksi.',
  img:{src:wm('00-bma-automation-operator-panel-with-pushbuttons.JPG'), credit:'Wikimedia Commons — "Operator panel with pushbuttons" oleh Elmschrat (CC BY-SA 3.0)', cap:'Panel kendali dengan tombol dan lampu indikator'},
  sections:[
    {h:'a. Pengertian Panel', blocks:[
      {t:'p', text:'<b>Panel kendali pensaklaran beban</b> adalah panel yang mengendalikan perpindahan sumber daya dari PLN ke genset (dan sebaliknya) tanpa mengganggu operasional gedung.'},
      {t:'p', text:'Selain panel kendali, dikenal <b>panel distribusi</b>: <b>MDP</b> (Main Distribution Panel) menerima pasokan utama lalu membaginya, sedangkan <b>SDP</b> (Sub Distribution Panel) membagi lagi ke kelompok beban.'},
      {t:'note', title:'Intinya', text:'Panel = pusat pembagian + proteksi + pengendalian listrik dalam gedung.'}
    ]},
    {h:'b. Dasar Teori: Perpindahan Sumber (PLN–Genset)', blocks:[
      {t:'ul', items:[
        '<b>Manual</b> — operator memindahkan saklar dengan tangan saat listrik padam.',
        '<b>ATS</b> (Automatic Transfer Switch) — memindahkan sumber dari PLN ke genset secara otomatis saat pemadaman.',
        '<b>AMF</b> (Automatic Main Failure) — menyalakan genset otomatis saat PLN gagal, lalu mematikannya kembali saat PLN normal.',
        '<b>Interlock</b> — pengaman agar PLN dan genset tidak pernah terhubung bersamaan (mencegah hubung singkat/bahaya).'
      ]},
      {t:'case', title:'Contoh Kasus', text:'Pemilik menghendaki panel genset bisa mensuplai arus ke seluruh gedung secara otomatis setelah pemadaman. Solusinya: panel dilengkapi ATS + AMF, dengan interlock mekanik/elektrik serta proteksi MCB/MCCB.'}
    ]},
    {h:'c. Komponen Panel', blocks:[
      {t:'table', head:['Komponen','Fungsi singkat'], rows:[
        ['MCB','Memutus arus otomatis saat beban lebih/singkat (kapasitas kecil, mis. per cabang)'],
        ['MCCB','Seperti MCB namun untuk arus lebih besar (panel utama)'],
        ['Kontaktor','Saklar elektromagnetik untuk menghubungkan/melepas beban'],
        ['Relay','Pengendali logika panel (mis. urutan start)'],
        ['TOR (Thermal Overload Relay)','Melindungi motor/genset dari beban lebih'],
        ['Busbar','Penghantar utama pembagi arus di dalam panel'],
        ['Lampu indikator','Menandakan status sumber (PLN/genset) menyala atau tidak'],
        ['Alat ukur (V/A meter)','Memantau tegangan dan arus panel']
      ]}
    ]},
    {h:'d. Langkah Pembuatan Panel', blocks:[
      {t:'ul', items:[
        'Survei difokuskan pada <b>peralatan yang akan dikendalikan</b> (mis. genset: kapasitas, tegangan, sistem starter).',
        'Menyusun gambar rancangan panel dan rencana anggaran bahan sesuai kebutuhan.',
        'Melakukan <b>perhitungan peralatan, kabel, dan proteksi</b> agar arus sesuai batas ukur.',
        'Mengonsultasikan cara kerja panel dengan pemilik pekerjaan.',
        'Merakit (manufaktur) panel, lalu mengujinya sebelum diserahkan.'
      ]}
    ]},
    {h:'e. Dasar Perhitungan Sederhana', blocks:[
      {t:'p', text:'Ilmu ketenagalistrikan sangat dibutuhkan di sini, terutama perhitungan peralatan, kabel, dan proteksi agar arus sesuai dengan batas ukurnya.'},
      {t:'formula', text:'Arus nominal  I = P / V<br>Pilih rating MCB/MCCB ≥ arus nominal, dibulatkan ke ukuran standar terdekat.'},
      {t:'ul', items:[
        'Hitung total daya beban tiap kelompok (lampu, stop kontak, genset).',
        'Tentukan arus nominal, lalu pilih rating MCB/MCCB di atasnya.',
        'Pilih ukuran kabel dengan <b>KHA</b> (Kemampuan Hantar Arus) lebih besar dari arus beban.',
        'Perhatikan panjang kabel agar penurunan tegangan (drop tegangan) tetap kecil.'
      ]}
    ]}
  ],
  rangkuman:'Pembuatan panel = pengertian panel kendali/distribusi → dasar perpindahan sumber (manual/ATS/AMF + interlock) → pilih komponen (MCB, MCCB, kontaktor, relay, TOR, busbar, indikator, alat ukur) → survei peralatan → gambar + RAB → hitung arus/kabel/proteksi → konsultasi cara kerja → rakit & uji. Contoh nyata: ATS genset otomatis.',
  glosarium:[
    {istilah:'Panel kendali', arti:'Panel yang mengendalikan perpindahan sumber daya PLN–genset.'},
    {istilah:'MDP / SDP', arti:'Main/Sub Distribution Panel — panel pembagi utama dan panel pembagi cabang.'},
    {istilah:'ATS', arti:'Automatic Transfer Switch — pengalih sumber otomatis PLN→genset.'},
    {istilah:'AMF', arti:'Automatic Main Failure — penyala genset otomatis saat PLN gagal.'},
    {istilah:'Interlock', arti:'Pengaman agar dua sumber tidak terhubung bersamaan.'},
    {istilah:'MCB / MCCB', arti:'Pemutus arus otomatis untuk arus kecil/sedang (MCB) dan arus besar (MCCB).'},
    {istilah:'KHA', arti:'Kemampuan Hantar Arus — batas arus aman sebuah kabel.'},
    {istilah:'Busbar', arti:'Penghantar utama (tembaga/aluminium) pembagi arus di dalam panel.'}
  ],
  kuis:[
    {q:"Fokus survei saat pembuatan panel adalah…", o:["Warna panel", "Harga makan siang teknisi", "Peralatan yang akan dikendalikan", "Jumlah jendela gedung"], a:2, why:"Survei difokuskan pada peralatan yang dikendalikan, misalnya genset."},
    {q:"Sebelum membuat panel, teknisi harus menghitung…", o:["Peralatan, kabel, dan proteksi", "Biaya iklan", "Jumlah karyawan", "Luas atap"], a:0, why:"Perhitungan peralatan, kabel, dan proteksi adalah inti perencanaan panel."},
    {q:"Contoh kasus di materi: setelah pemadaman, panel harus…", o:["Mematikan seluruh gedung", "Mensuplai arus ke seluruh gedung secara otomatis", "Menunggu instruksi manual setiap saat", "Memutus semua rangkaian"], a:1, why:"Pemilik menghendaki genset otomatis mensuplai seluruh gedung saat PLN padam."},
    {q:"Perhitungan proteksi panel (MCB/relay) dibuat…", o:["Tanpa perhitungan", "Sebesar mungkin", "Sembarangan", "Sesuai batas ukur"], a:3, why:"Perhitungan peralatan, kabel, dan proteksi harus sesuai batas ukur agar aman."},
    {q:"Alat yang MENYALAKAN genset otomatis saat PLN gagal adalah…", o:["ATS", "AMF", "Busbar", "MCB"], a:1, why:"AMF (Automatic Main Failure) menyalakan genset otomatis saat PLN gagal."},
    {q:"Panel kendali pensaklaran beban berfungsi untuk…", o:["Menghias ruang panel", "Menyimpan kabel cadangan", "Mengendalikan perpindahan sumber PLN ke genset", "Mengukur suhu ruangan"], a:2, why:"Panel ini mengendalikan pensaklaran (perpindahan) beban dari PLN ke genset."},
    {q:"Alat ukur yang tepat untuk memeriksa tegangan panel adalah…", o:["Termometer", "Barometer", "Multimeter", "Meteran kain"], a:2, why:"Multimeter mengukur tegangan, arus, dan resistansi pada panel."},
    {q:"Gedung yang otomatis beralih ke genset saat PLN padam menggunakan…", o:["Kapasitor bank", "Sekring", "ATS (Automatic Transfer Switch)", "Trafo step-down"], a:2, why:"ATS memindahkan sumber otomatis saat pemadaman terjadi."},
    {q:"Cara kerja panel sebelum dibuat sebaiknya…", o:["Dititipkan ke supplier", "Dikonsultasikan dengan pemilik pekerjaan", "Dirahasiakan", "Diacak"], a:1, why:"Konsultasi memastikan panel sesuai kebutuhan dan harapan pemilik."},
    {q:"Panel yang membagi pasokan utama ke beberapa kelompok beban disebut…", o:["TOR", "Truss", "MDP", "ATS"], a:2, why:"MDP (Main Distribution Panel) membagi pasokan utama; SDP membagi ke kelompok cabang."},
    {q:"Interlock pada panel dua sumber berfungsi…", o:["Mengurangi tegangan", "Mempercepat genset", "Mencegah PLN & genset terhubung bersamaan", "Menambah beban"], a:2, why:"Interlock mencegah dua sumber terhubung bersamaan agar tidak terjadi hubung singkat."},
    {q:"Kemampuan Hantar Arus (KHA) berkaitan dengan…", o:["Warna kabel", "Batas arus aman sebuah kabel", "Harga panel", "Jumlah lampu"], a:1, why:"KHA adalah batas arus aman yang boleh dilewatkan sebuah kabel."}
  ]
},
{
  num:3, judul:'Pemeliharaan, Perbaikan, dan Perawatan Peralatan',
  tujuan:'Memahami jenis-jenis pemeliharaan, penyusunan SOP dan jadwal perawatan, pengecekan harian, alur penanganan kerusakan, serta dasar K3 dalam pekerjaan ketenagalistrikan.',
  img:{src:wm("US Navy 040311-N-6433N-040 Electrician's Mate Fireman Brian Smith, of Independence, Mo., replaces a fuse in a switch panel aboard USS George Washington (CVN 73).jpg"), credit:'Wikimedia Commons — "Electrician replaces a fuse in a switch panel" (US Navy, public domain)', cap:'Teknisi mengganti sekring pada panel saklar dengan alat pelindung diri'},
  sections:[
    {h:'a. Pengertian Pemeliharaan', blocks:[
      {t:'p', text:'<b>Pemeliharaan (maintenance)</b> adalah rangkaian kegiatan untuk menjaga peralatan ketenagalistrikan tetap bekerja sesuai fungsinya, aman, dan berumur panjang.'},
      {t:'ul', items:[
        '<b>Preventif</b> — perawatan terjadwal sebelum kerusakan terjadi.',
        '<b>Korektif</b> — perbaikan setelah kerusakan terjadi.',
        '<b>Prediktif</b> — perawatan berdasarkan pemantauan kondisi (mis. suhu, getaran, arus).'
      ]},
      {t:'note', title:'Kenapa penting?', text:'Perawatan preventif jauh lebih murah daripada perbaikan besar akibat kerusakan total.'}
    ]},
    {h:'b. Dasar: SOP dan Jadwal Pemeliharaan', blocks:[
      {t:'p', text:'Pemilik gedung telah memiliki desain gedung dari jasa instalasi & panel. Dari data itu, pihak pemelihara menyusun <b>SOP (Standar Operasional Prosedur) sesuai peralatan yang digunakan</b> — SOP panel berbeda dengan SOP AC atau lift.'},
      {t:'table', head:['Peralatan','Contoh jadwal'], rows:[
        ['AC','Diperiksa/dibersihkan 3 bulan sekali'],
        ['Lampu','Diganti saat mati / dicek rutin'],
        ['Lift','Sesuai jadwal vendor & inspeksi'],
        ['Pompa air','Cek rutin debit, suara, dan kebocoran'],
        ['Panel','Cek indikator, suhu, dan kekencangan terminal']
      ]}
    ]},
    {h:'c. Pengecekan Harian', blocks:[
      {t:'p', text:'Pengecekan harian dilakukan untuk <b>deteksi dini kerusakan</b> sebelum menjadi kerusakan besar.'},
      {t:'ul', items:[
        'Lampu indikator panel menyala normal atau tidak.',
        'Suara/bunyi tidak wajar pada mesin (pompa, lift).',
        'Kebocoran air atau bau terbakar.',
        'Panas berlebih dan getaran berlebih.'
      ]}
    ]},
    {h:'d. Penanganan Kerusakan', blocks:[
      {t:'ul', items:[
        'Jika kerusakan dapat ditangani tim internal (teknisi gedung), dikerjakan secara internal.',
        'Jika tidak dapat ditangani internal, di-order ke pihak ketiga (vendor/ahli).',
        'Tim pemelihara menerima data kerusakan dari laporan pemilik, sehingga harus selalu <b>siap sedia</b>.'
      ]},
      {t:'case', title:'Contoh Kasus', text:'MCB panel sering trip berulang. Langkahnya: cek beban/rangkaian sesuai SOP (bukan langsung mengganti MCB berulang) → identifikasi penyebab: beban lebih, kabel longgar, atau gangguan isolasi → tangani sendiri bila mampu, atau order ke pihak ketiga bila perlu.'}
    ]},
    {h:'e. Dasar K3 (Keselamatan Kerja)', blocks:[
      {t:'ul', items:[
        'Pastikan sumber terputus dan terpasang label "<i>jangan dihidupkan</i>" saat bekerja.',
        'Gunakan alat ukur yang benar dan alat pelindung diri (sarung tangan, sepatu isolasi).',
        'Lakukan uji bebas tegangan sebelum menyentuh rangkaian.',
        'Bekerja berpasangan untuk pekerjaan panel/berisiko tinggi.'
      ]}
    ]}
  ],
  rangkuman:'Pemeliharaan = jenis (preventif/korektif/prediktif) + SOP per peralatan + jadwal (AC 3 bulan dll) + cek harian deteksi dini + penanganan: internal bila bisa, pihak ketiga bila tidak + patuhi K3.',
  glosarium:[
    {istilah:'SOP', arti:'Standar Operasional Prosedur — langkah baku pekerjaan untuk suatu peralatan.'},
    {istilah:'Preventif', arti:'Perawatan terjadwal sebelum kerusakan terjadi.'},
    {istilah:'Korektif', arti:'Perbaikan yang dilakukan setelah kerusakan terjadi.'},
    {istilah:'Prediktif', arti:'Perawatan berdasarkan pemantauan kondisi peralatan.'},
    {istilah:'K3', arti:'Keselamatan dan Kesehatan Kerja — aturan bekerja aman.'},
    {istilah:'Work order', arti:'Perintah kerja tertulis untuk suatu tugas perbaikan/perawatan.'},
    {istilah:'Downtime', arti:'Waktu ketika peralatan tidak beroperasi (berhenti).'}
  ],
  kuis:[
    {q:"Perawatan berdasarkan pemantauan kondisi (suhu/getaran) disebut…", o:["Darurat", "Prediktif", "Preventif", "Korektif"], a:1, why:"Perawatan prediktif didasarkan pada pemantauan kondisi peralatan."},
    {q:"Yang BUKAN contoh objek jadwal pemeliharaan di materi adalah…", o:["Lift", "Mesin pesawat terbang", "Lampu", "Pompa air"], a:1, why:"Objek pemeliharaan: AC, lampu, lift, pompa air, panel."},
    {q:"Kerusakan yang tidak bisa ditangani internal sebaiknya…", o:["Disembunyikan", "Diorder ke pihak ketiga", "Dibiarkan", "Diperbaiki paksa tanpa ahli"], a:1, why:"Kerusakan di luar kemampuan internal di-order ke vendor/pihak ketiga."},
    {q:"Perawatan yang dilakukan sebelum kerusakan terjadi disebut…", o:["Preventif", "Darurat", "Pasca-jual", "Korektif"], a:0, why:"Perawatan preventif mencegah kerusakan — dilakukan lewat jadwal & cek rutin."},
    {q:"Yang dimaksud downtime adalah…", o:["Jadwal cuti", "Jam kerja teknisi", "Waktu peralatan tidak beroperasi/berhenti", "Waktu peralatan beroperasi"], a:2, why:"Downtime adalah waktu saat peralatan berhenti/tidak beroperasi."},
    {q:"Sebelum bekerja pada rangkaian, teknisi wajib…", o:["Langsung menyentuh kabel", "Menaikkan beban", "Memastikan sumber terputus & uji bebas tegangan", "Mematikan semua lampu gedung"], a:2, why:"Pastikan sumber terputus dan lakukan uji bebas tegangan sebelum menyentuh rangkaian (K3)."},
    {q:"Jika panel listrik sering MCB-trip, langkah pertama adalah…", o:["Lepas MCB-nya", "Ignore", "Ganti MCB terus", "Cek beban/rangkaian sesuai SOP"], a:3, why:"Diagnosa sesuai SOP dulu; bukan asal ganti komponen."},
    {q:"Tujuan pengecekan harian adalah…", o:["Mengganti semua kabel", "Menaikkan tagihan listrik", "Deteksi dini kerusakan", "Menghabiskan waktu"], a:2, why:"Cek harian mendeteksi kerusakan kecil sebelum menjadi besar."},
    {q:"Perawatan korektif dilakukan…", o:["Sebelum kerusakan", "Hanya saat audit", "Setiap hari tanpa alasan", "Setelah kerusakan terjadi"], a:3, why:"Perawatan korektif dilakukan setelah kerusakan terjadi."},
    {q:"Jadwal perawatan AC yang umum adalah…", o:["3 bulan sekali", "3 hari sekali", "10 tahun sekali", "3 tahun sekali"], a:0, why:"Contoh di materi: AC dirawat 3 bulan sekali."},
    {q:"Tim pemeliharaan gedung harus selalu…", o:["Cuti terus", "Siap sedia", "Libur saat kerusakan", "Hanya datang saat ada keluhan"], a:1, why:"Kesiapan tim membuat penanganan kerusakan cepat."},
    {q:"SOP perawatan disusun…", o:["Sama untuk semua alat", "Sesuai peralatan yang digunakan", "Hanya untuk AC", "Sekali seumur hidup"], a:1, why:"SOP harus disesuaikan karakteristik tiap peralatan."}
  ]
},
{
  num:4, judul:'Pengelolaan SDM',
  tujuan:'Memahami pengertian pengelolaan SDM, posisi kerja lulusan TITL, alur proyek ME menyeluruh, kompetensi & sertifikasi, serta struktur organisasi proyek ME.',
  img:{src:wm("US Navy 070328-N-1003P-002 Master Chief Engineman Shannon Thornton and Electrician's Mate 1st Class Brent Arntzen assigned to Combined Joint Task Force-Horn of Africa's Mobile Training Team teach members of the Djiboutian Navy.jpg"), credit:'Wikimedia Commons — "Mobile Training Team teach members of the Djiboutian Navy" (US Navy, public domain)', cap:'Tim pengajar melatih teknisi muda — pengelolaan SDM dan kompetensi'},
  sections:[
    {h:'a. Pengertian Pengelolaan SDM', blocks:[
      {t:'p', text:'<b>Sumber Daya Manusia (SDM)</b> adalah tenaga kerja yang mengerjakan suatu pekerjaan. <b>Pengelolaan SDM</b> berarti mengatur orang agar kompetensinya tepat guna: menempatkan orang yang tepat pada tahap pekerjaan yang tepat.'},
      {t:'note', title:'Tujuan', text:'Mutu kerja terjaga, pekerjaan selesai tepat waktu, dan biaya proyek tetap efisien.'}
    ]},
    {h:'b. Posisi Kerja Lulusan TITL', blocks:[
      {t:'p', text:'Banyak posisi penting dalam proyek ME dapat diisi oleh lulusan SMK Teknik Ketenagalistrikan:'},
      {t:'table', head:['Tahap pekerjaan','Posisi contoh'], rows:[
        ['Perencanaan','Drafter gambar instalasi, estimator RAB'],
        ['Pemasangan','Teknisi instalasi listrik'],
        ['Pengujian','Teknisi testing & commissioning'],
        ['Pemeliharaan','Teknisi pemeliharaan/perawatan'],
        ['Perbaikan','Teknisi perbaikan, supervisor kerja']
      ]}
    ]},
    {h:'c. Alur Proyek ME Menyeluruh', blocks:[
      {t:'formula', text:'Perencanaan → gambar instalasi → survey → RAB → pemasangan → testing → commissioning → pemeliharaan → perawatan → perbaikan'},
      {t:'p', text:'Tiap tahap membutuhkan kompetensi berbeda. Lulusan TITL dapat mengisi posisi di sepanjang alur tersebut, mulai dari sisi perencanaan sampai perbaikan kerusakan.'}
    ]},
    {h:'d. Kompetensi & Sertifikasi', blocks:[
      {t:'ul', items:[
        '<b>Kompetensi teknis</b>: membaca gambar, mengukur, memasang, dan memperbaiki instalasi.',
        '<b>Kompetensi K3</b>: bekerja aman serta memahami prosedur keselamatan.',
        '<b>Sertifikasi/keahlian</b> (mis. teknisi listrik berlisensi) meningkatkan nilai di dunia kerja.',
        '<b>Soft skill</b>: komunikasi, kerja tim, disiplin, dan tanggung jawab.'
      ]}
    ]},
    {h:'e. Struktur Organisasi Proyek ME', blocks:[
      {t:'table', head:['Peran','Tugas singkat'], rows:[
        ['Project Manager','Memimpin dan bertanggung jawab penuh atas proyek'],
        ['Site Engineer','Mengatur teknis pelaksanaan di lapangan'],
        ['Supervisor','Mengawasi mutu & keselamatan kerja'],
        ['Teknisi','Melaksanakan pekerjaan instalasi/perawatan']

      {t:'case', title:'Contoh Kasus', text:'Proyek memasang instalasi gedung baru: estimator menyusun RAB, drafter membuat gambar, teknisi memasang, site engineer mengatur urutan kerja, supervisor mengawasi K3, lalu teknisi pemeliharaan merawat setelah serah terima. Jika satu posisi kosong, alur bisa tersendat — inilah inti pengelolaan SDM.'}

  ['kuis1','kuis2','kuis3','kuis4'].forEach(function(k){ if(p.kuis && p.kuis[k]) e.kuis[k]=p.kuis[k]; });
  if(p.ujian) e.ujian = p.ujian;
  if(p.pretest) e.pretest = p.pretest;
  if(p.posttest) e.posttest = p.posttest;
  return e;
}
function gasExec(action, data, cb){
  fetch(GAS_EXEC_URL, { method:'POST', body: JSON.stringify({ action: action, data: data || {} }) })
    .then(function(r){ return r.json(); })
    .then(function(res){ cb(res); })
    .catch(function(){ cb(null); });
}
function apiCall(fnName, payload, cb){
  // submitPretest/submitPosttest hanya ada sebagai action router /exec & /api;
  // saat di dalam GAS (HtmlService) petakan ke submitMateriQuiz(payload).
  var gasFn = (fnName==='submitPretest' || fnName==='submitPosttest') ? 'submitMateriQuiz' : fnName;
  if(BACKEND==='gas'){
    google.script.run.withSuccessHandler(cb).withFailureHandler(function(){ cb(null); })[gasFn](payload);
  } else if(USE_GAS_DIRECT){
    gasExec(fnName, payload, function(res){
      if(res) { cb(res); return; }
      // fallback lokal bila /exec tidak terjangkau (offline/demo)
      fetch('/api/'+fnName, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
        .then(function(r){return r.json()}).then(cb).catch(function(){ cb(null); });
    });
  } else {
    fetch('/api/'+fnName, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json()}).then(cb).catch(function(){ cb(null); });
  }
}
function loadProgress(cb){
  if(!user){ cb(emptyProgress()); return; }
  apiCall('getStudentProgress', {userId:user.id, nis:user.nis}, function(res){
    if(res && res.success && res.progress){ progress = normalizeProgress(res.progress); }
    else { progress = lsLoad() || emptyProgress(); }
    lsSave(progress);
    cb(progress);
  });
}
function saveQuizResult(quizKey, score, total, cb){
  var nilai = Math.round(score/total*100);
  var rec = {best:nilai, passed:nilai>=PASS_SCORE, score:score, total:total, at:new Date().toISOString()};
  // optimistic local
  if(quizKey==='ujian') progress.ujian = rec;
  else if(quizKey==='pretest') progress.pretest = rec;
  else if(quizKey==='posttest') progress.posttest = rec;
  else progress.kuis[quizKey] = rec;
  lsSave(progress);
  var action = (quizKey==='pretest') ? 'submitPretest' : (quizKey==='posttest' ? 'submitPosttest' : 'submitMateriQuiz');
  apiCall(action, {userId:user.id, nis:user.nis, quizKey:quizKey, score:score, total:total}, function(res){
    if(res && res.success && res.progress){ progress = normalizeProgress(res.progress); lsSave(progress); }
    else if(res && !res.success){ showToast('Nilai tersimpan lokal, gagal ke server: '+(res.message||'unknown'), 'error'); }
    cb(progress);
  });
}

/* ---------- GATING ---------- */
function quizPassed(key){
  var node;
  if(key==='ujian') node = progress.ujian;
  else if(key==='pretest') node = progress.pretest;
  else if(key==='posttest') node = progress.posttest;
  else node = progress.kuis[key];
  return !!(node && node.passed);
}
function isPretestUnlocked(){ return true; }
function isPosttestUnlocked(){ return quizPassed('pretest'); }
function isMateriUnlocked(num){
  if(num===1) return true;
  return quizPassed('kuis'+(num-1));
}
function isUjianUnlocked(){
  return quizPassed('kuis4');
}
function bestScore(key){
  var node;
  if(key==='ujian') node = progress.ujian;
  else if(key==='pretest') node = progress.pretest;
  else if(key==='posttest') node = progress.posttest;
  else node = progress.kuis[key];
  return node ? node.best : null;
}

   Satu-satunya pemicu menu adalah tombol di mobile-topbar.
   Saat terbuka: menu overlay + scroll terkunci di menu, konten belakang diam. */
function toggleSidebar(force){
  var sb = document.getElementById('sidebar');
  var bd = document.getElementById('sbBackdrop');
  var buka = (typeof force === 'boolean') ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', buka);
  if(bd) bd.classList.toggle('show', buka);
  document.body.classList.toggle('menu-open', buka);
  return false;
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') toggleSidebar(false);
});

/* ---------- ROUTER ---------- */
var routes = { dashboard:renderDashboard, materi:renderMateriList, materidetail:renderMateriDetail, kuis:renderKuis, ujian:renderUjian, angket:renderAngket, pretest:renderPretest, posttest:renderPosttest };
function route(){
  var h = (location.hash||'#/dashboard').replace('#/','');
  var parts = h.split('/');
  var page = parts[0]||'dashboard';
  var arg = parts[1]?decodeURIComponent(parts[1]):null;
  toggleSidebar(false); // tutup menu tiap pindah halaman (sekaligus buka kunci scroll)
  (routes[page]||renderDashboard)(arg);
  highlightNav(page, arg);
  window.scrollTo(0,0);
}
function go(path){
  // Kalau hash-nya sama, hashchange tidak terpicu -> panggil route() langsung.
  if(location.hash === path || location.hash === '#'+path){ route(); return; }
  location.hash = path;
}
function highlightNav(page, arg){
  document.querySelectorAll('.sidebar-nav a').forEach(function(a){
    var r = a.getAttribute('data-r');
    a.classList.toggle('active', r===page && (!arg || a.getAttribute('data-arg')===String(arg)));
  });
}

  [['pretest','Tes Awal'],['posttest','Tes Akhir']].forEach(function(pp){
    var onP = quizPassed(pp[0]);
    var nilaiP = bestScore(pp[0]);
    var stP = onP ? 'LULUS' : ((pp[0]==='posttest' && !isPosttestUnlocked()) ? 'TERKUNCI' : 'MENUNGGU');
    rows += '<div class="breaker '+(onP?'on':'off')+'">'
      + '<span class="lamp"></span><span class="tag">'+(pp[0]==='pretest'?'P0':'P1')+'</span>'
      + '<span class="name">'+pp[1]+'</span>'

      + '<span class="state">'+stP+'</span></div>';
  });
  MATERI.forEach(function(m){
    var on = quizPassed('kuis'+m.num);
    var nilai = bestScore('kuis'+m.num);
    var unlocked = isMateriUnlocked(m.num);
    var state = on ? 'LULUS' : (unlocked ? 'MENUNGGU' : 'TERKUNCI');
    rows += '<div class="breaker '+(on?'on':'off')+'">'
      + '<span class="lamp"></span><span class="tag">Q'+m.num+'</span>'
      + '<span class="name">M'+m.num+' · '+m.judul.split(' ').slice(0,2).join(' ')+'</span>'
      + '<span class="val">'+(nilai===null?'—':nilai)+'</span>'
      + '<span class="state">'+state+'</span></div>';
  });
  var onU = quizPassed('ujian');
  var uNilai = bestScore('ujian');
  rows += '<div class="breaker '+(onU?'on':'off')+'">'
    + '<span class="lamp"></span><span class="tag">Q5</span>'
    + '<span class="name">Ujian Akhir</span>'
    + '<span class="val">'+(uNilai===null?'—':uNilai)+'</span>'
    + '<span class="state">'+(onU?'LULUS':(isUjianUnlocked()?'SIAP':'TERKUNCI'))+'</span></div>';

  var avg = [];
  ['kuis1','kuis2','kuis3','kuis4'].forEach(function(k){ if(progress.kuis[k]) avg.push(progress.kuis[k].best); });
  var avgNilai = avg.length ? Math.round(avg.reduce(function(a,b){return a+b;},0)/avg.length) : null;
  var semuaLulus = ['pretest','posttest','kuis1','kuis2','kuis3','kuis4','ujian'].every(function(k){ return quizPassed(k); });

  return '<div class="panel">'
    + '<div class="panel-head"><div class="panel-title"><span class="bolt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span> Panel Progres Belajar</div>'

    + '<div class="panel-foot">'
    + '<div><div class="label">Rata-rata nilai kuis</div><div class="readout">'+(avgNilai===null?'—':avgNilai)+'</div></div>'
    + '<div style="text-align:right"><div class="label">Status</div><div class="readout" style="font-size:15px">'+(semuaLulus?'LULUS':'BELAJAR')+'</div></div>'

/* ---------- RENDER: BLOK KAYA (paragraf, daftar, tabel, kotak, rumus) ---------- */
function renderBlocks(blocks){
  if(!blocks) return '';
  return blocks.map(function(b){
    if(!b) return '';
    if(b.t==='ul') return '<ul>'+(b.items||[]).map(function(i){ return '<li>'+i+'</li>'; }).join('')+'</ul>';
    if(b.t==='table') return '<div class="table-wrap" style="margin:10px 0"><table class="comp-table"><thead><tr>'
      + (b.head||[]).map(function(h){ return '<th>'+h+'</th>'; }).join('')
      + '</tr></thead><tbody>'
      + (b.rows||[]).map(function(r){ return '<tr>'+r.map(function(cl){ return '<td>'+cl+'</td>'; }).join('')+'</tr>'; }).join('')
      + '</tbody></table></div>';
    if(b.t==='note') return '<div class="blk-note"><strong>'+ICON.search+(b.title||'')+'</strong><div>'+b.text+'</div></div>';
    if(b.t==='case') return '<div class="blk-case"><strong>'+ICON.grid+(b.title||'')+'</strong><div>'+b.text+'</div></div>';
    if(b.t==='formula') return '<div class="blk-formula">'+(b.text||'')+'</div>';
    return '<p>'+(b.text||'')+'</p>';
  }).join('');
}
function renderGlosarium(g){
  if(!g || !g.length) return '';
  return '<div class="glossary"><div class="glossary-title">'+ICON.book+' Glosarium Istilah</div>'
    + g.map(function(x){ return '<div class="glossary-row"><span class="glossary-term">'+x.istilah+'</span><span class="glossary-arti">'+x.arti+'</span></div>'; }).join('')
    + '</div>';
}

/* ---------- KUIS & UJIAN — halaman penuh (bukan modal) ---------- */
var quiz = null;

// Halaman kembali: sumber kuis kalau keluar sebelum selesai.
function kuisKembali(key){
  if(key==='ujian') return '/ujian';
  if(key==='pretest') return '/pretest';
  if(key==='posttest') return '/posttest';
  return '/materidetail/'+String(key).replace('kuis','');
}
// Halaman lanjutan setelah hasil tampil.
function kuisLanjut(key, nomor, isUjian, passed){
  if(key==='pretest') return passed ? { href:'#/materidetail/1', label:'Mulai Materi 1 →' } : { href:'#/pretest', label:'Coba Pretest lagi' };
  if(key==='posttest') return passed ? { href:'#/dashboard', label:'Ke Dashboard' } : { href:'#/posttest', label:'Coba Posttest lagi' };
  if(!passed) return { href:'#'+kuisKembali(key), label:'Kembali ke materi' };
  if(isUjian) return { href:'#/dashboard', label:'Ke Dashboard' };
  if(nomor < MATERI.length) return { href:'#/materidetail/'+(nomor+1), label:'Materi '+(nomor+1)+' →' };
  return { href:'#/ujian', label:'Ujian Akhir →' };
}
// Pintu masuk dari tombol: pindah ke halaman kuis.
function startQuiz(key){ go('/kuis/'+key); }

/* ---------- ACAK SOAL (anti-hafalan pola jawaban) ----------
   Setiap kali kuis dimulai, urutan soal DAN urutan opsi (A-D) diacak
   per siswa per percobaan. Kunci jawaban mengikuti teks opsi yang benar,
   jadi penilaian tetap valid. Acakan hanya di memori (tidak mengubah bank soal). */
function acakArray(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  return arr;
}
function siapkanSoalAcak(qs){
  var salin = qs.map(function(q){
    return { q:q.q, o:q.o.slice(), a:q.a, why:q.why };
  });
  acakArray(salin); // acak urutan soal
  salin.forEach(function(q){
    var benar = q.o[q.a]; // teks jawaban yang benar
    acakArray(q.o);       // acak urutan opsi
    q.a = q.o.indexOf(benar); // kunci mengikuti teks yang benar
  });
  return salin;
}

function renderKuis(key){
  var main = document.getElementById('main');
  var isUjian = key==='ujian';
  var isPre = key==='pretest';
  var isPost = key==='posttest';
  var nomor = Number(String(key).replace('kuis',''));
  if(isUjian && !isUjianUnlocked()){
    main.innerHTML = '<div class="locked-note">'+ICON.lock+' Ujian Akhir terbuka setelah kamu lulus kuis Materi 4. <a href="#/dashboard">Kembali ke dashboard</a></div>';
    return;
  }
  if(isPost && !isPosttestUnlocked()){
    main.innerHTML = '<div class="locked-note">'+ICON.lock+' Posttest terbuka setelah kamu lulus Pretest. <a href="#/pretest">Kerjakan Pretest</a></div>';
    return;
  }
  if(!isUjian && !isPre && !isPost && (!MATERI[nomor-1] || !isMateriUnlocked(nomor))){
    main.innerHTML = '<div class="locked-note">'+ICON.lock+' Kuis ini terkunci. Lulus kuis sebelumnya dulu (nilai ≥ '+PASS_SCORE+'). <a href="#/dashboard">Kembali ke dashboard</a></div>';
    return;
  }
  var qs = isUjian ? UJIAN : (isPre ? PRETEST : (isPost ? POSTTEST : MATERI[nomor-1].kuis));
  var label = isUjian ? 'Ujian Akhir' : (isPre ? 'Pretest' : (isPost ? 'Posttest' : 'Kuis Materi '+nomor));
  quiz = { key:key, isUjian:isUjian, nomor:nomor, label:label, qs:siapkanSoalAcak(qs), idx:0, ans:new Array(qs.length).fill(null), done:false };
  drawKuis();
}

function drawKuis(restoreScroll){
  if(!quiz || quiz.done) return;
  var y = (restoreScroll===true) ? (window.scrollY||window.pageYOffset||0) : null;
  var q = quiz.qs[quiz.idx];
  var jawab = quiz.ans.filter(function(a){ return a!==null; }).length;
  var opts = q.o.map(function(o,i){
    return '<button class="'+(quiz.ans[quiz.idx]===i?'sel':'')+'" onclick="pickOpt('+i+')">'
      + '<span class="opt-key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>';
  }).join('');
  var nav = quiz.qs.map(function(_, i){
    var cls = (i===quiz.idx) ? 'current' : (quiz.ans[i]!==null ? 'answered' : '');
    return '<button class="'+cls+'" onclick="gotoSoal('+i+')">'+(i+1)+'</button>';
  }).join('');
  document.getElementById('main').innerHTML = ''
  + '<div class="quiz-page">'
  + '<div class="quiz-top">'
  + '<a class="quiz-exit" href="#'+kuisKembali(quiz.key)+'">← Keluar</a>'
  + '<div class="quiz-top-title">'+(quiz.isUjian?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> Ujian Akhir':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> '+(quiz.label||('Kuis Materi '+quiz.nomor)))+'</div>'
  + '<span class="badge-pill">Soal '+(quiz.idx+1)+'/'+quiz.qs.length+'</span>'
  + '</div>'
  + '<div class="progress" style="margin:12px 0 14px"><div class="progress-bar green" style="width:'+(jawab/quiz.qs.length*100)+'%"></div></div>'
  + '<div class="card quiz-card-full">'
  + '<div class="quiz-q">'+q.q+'</div>'
  + '<div class="quiz-opts">'+opts+'</div>'
  // Pembahasan SENGAJA tidak ditampilkan selama ujian (anti-contek):
  // baru muncul di halaman hasil untuk soal yang belum tepat.
  + (quiz.ans[quiz.idx]!==null ? '<div class="why-box" style="display:block">'+ICON.check+' Jawaban tersimpan. Lanjut ke soal berikutnya.</div>' : '<div class="why-box" id="whyBox"></div>')
  + '</div>'
  + '<div class="card quiz-nav-wrap">'
  + '<div class="quiz-nav-title"><span>Navigasi soal</span><span class="quiz-answered-bar">'+jawab+'/'+quiz.qs.length+' terjawab</span></div>'
  + '<div class="quiz-nav">'+nav+'</div>'
  + '</div>'
  + '<div class="quiz-foot">'
  + '<button class="btn btn-outline" onclick="quizNav(-1)" '+(quiz.idx===0?'disabled':'')+'>← Sebelumnya</button>'
  + '<button class="btn-hero-primary" onclick="quizNav(1)">'+(quiz.idx===quiz.qs.length-1?'Selesai →':'Lanjut →')+'</button>'
  + '</div>'
  + '</div>';
  if(y!==null){ window.scrollTo(0,y); } else { window.scrollTo(0,0); }
}

function gotoSoal(i){
  if(!quiz || quiz.done || i<0 || i>=quiz.qs.length) return;
  quiz.idx = i;
  drawKuis();
}

function pickOpt(i){
  quiz.ans[quiz.idx] = i;
  drawKuis(true); // tahan posisi scroll agar tidak lompat ke atas (penting di HP)
}

function quizBelumDijawab(){
  var kosong = [];
  quiz.qs.forEach(function(_, i){ if(quiz.ans[i]===null) kosong.push(i+1); });
  return kosong;
}

function quizNav(dir){
  if(dir===1 && quiz.ans[quiz.idx]===null){ showToast('Pilih salah satu jawaban dulu','error'); return; }
  var next = quiz.idx + dir;
  if(next >= quiz.qs.length){
    var kosong = quizBelumDijawab();
    if(kosong.length){
      showToast('Masih ada soal belum dijawab: no. '+kosong.slice(0,5).join(', ')+(kosong.length>5?'…':''), 'error');
      quiz.idx = kosong[0]-1;
      drawKuis();
      return;
    }
    return quizResult();
  }
  quiz.idx = (next < 0) ? 0 : next;
  drawKuis();
}

function quizResult(){
  if(!quiz) return;
  var kosong = quizBelumDijawab();
  if(kosong.length){
    showToast('Masih ada soal belum dijawab: no. '+kosong.slice(0,5).join(', ')+(kosong.length>5?'…':''), 'error');
    quiz.idx = kosong[0]-1;
    drawKuis();
    return;
  }
  var score = 0;
  quiz.qs.forEach(function(q,i){ if(quiz.ans[i]===q.a) score++; });
  var nilai = Math.round(score/quiz.qs.length*100);
  var passed = nilai >= PASS_SCORE;
  var key = quiz.key, isUjian = quiz.isUjian, nomor = quiz.nomor;
  quiz.done = true;

  // Review soal yang belum tepat + pembahasan.
  var salah = '';
  quiz.qs.forEach(function(q,i){
    if(quiz.ans[i] !== q.a){
      salah += '<div class="quiz-review-item">'
        + '<div><b>'+(i+1)+'. '+q.q+'</b></div>'
        + '<div>Jawabanmu: '+(quiz.ans[i]===null?'—':String.fromCharCode(65+quiz.ans[i]))
        + ' · Jawaban benar: <b>'+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'</b></div>'
        + (q.why ? '<div class="quiz-review-why">'+ICON.bulb+' '+q.why+'</div>' : '')
        + '</div>';
    }
  });
  var lanjut = kuisLanjut(key, nomor, isUjian, passed);

  document.getElementById('main').innerHTML = ''
  + '<div class="quiz-page"><div class="card quiz-result">'
  + '<div style="display:flex;justify-content:center;color:'+(passed?'var(--success)':'var(--accent)')+'">'+(passed?ICON.checkCircleBig:ICON.xCircle)+'</div>'
  + '<h2 style="margin:8px 0">Nilai kamu: '+nilai+'</h2>'
  + '<small>Benar '+score+' dari '+quiz.qs.length+' soal · KKTP '+PASS_SCORE+'</small><br><br>'
  + (passed
      ? (isUjian ? '<span class="pill pill-pass">'+ICON.award+' Selamat! Ujian Akhir selesai</span>'
        : (key==='pretest' ? '<span class="pill pill-pass">Materi 1 & Posttest terbuka!</span>'
        : (key==='posttest' ? '<span class="pill pill-pass">'+ICON.award+' Selamat! Posttest selesai</span>'
        : '<span class="pill pill-pass">Materi berikutnya terbuka!</span>')))
      : '<span class="pill pill-fail">Belum lulus — pelajari lagi materinya</span>')
  + '<div style="display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap">'
  + '<button class="btn btn-outline" onclick="startQuiz(\''+key+'\')">Coba lagi</button>'
  + '<a class="btn-hero-primary" href="'+lanjut.href+'">'+lanjut.label+'</a>'
  + '</div>'
  + (salah ? '<div class="quiz-review"><h3>Review jawaban yang belum tepat</h3>'+salah+'</div>' : '')
  + '</div></div>';
  window.scrollTo(0,0);

  saveQuizResult(key, score, quiz.qs.length, function(){
    renderNav();
    if(passed){ showToast((isUjian?'Ujian':(key==='pretest'?'Pretest':(key==='posttest'?'Posttest':'Kuis materi '+nomor)))+' lulus! Nilai: '+nilai, 'success'); }
  });
}

/* ---------- AUTH & INIT ---------- */
function doLogout(){
  var nis = user ? user.nis : null;
  var finish = function(){ localStorage.removeItem('user'); localStorage.removeItem('nis'); location.href='../'; };
  if(BACKEND==='gas' && nis){ google.script.run.withSuccessHandler(finish).logout(nis); }
  else if(USE_GAS_DIRECT && nis){ gasExec('logout', { nis: nis }, function(){ finish(); }); }
  else { finish(); }
}

function init(){
  try{ user = JSON.parse(localStorage.getItem('user')||'null'); }catch(e){ user=null; }
  if(!user || !user.nis){ location.href='../'; return; }
  if(['guru','admin'].indexOf(String(user.role||'').toLowerCase())!==-1){ location.href='../guru/'; return; }
  document.getElementById('sbUser').textContent = user.nama+' • '+user.kelas;
  loadProgress(function(){
    renderNav();
    window.addEventListener('hashchange', route);
    route();
  });
}
init();
